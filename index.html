<!--
  SwapAnalytics beacon. page_view is explicit via window.swapPageView (the app
  replaceStates / → /p/<id> on load; auto-fire or history patching would double-count).
-->
<script>
(function () {
  var ENDPOINT = 'https://analytics.swapp1990.org/api/events';
  var APP_ID = 'problem-recall';
  var PROD_HOST = 'leetcode.swapp1990.org';
  var DEVICE_KEY = 'swapanalytics_device_id';
  var lastPath = null;

  function uuid() {
    try {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
    } catch (e) {}
    try {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    } catch (e) {
      return String(Date.now());
    }
  }

  function getDeviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = uuid();
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    } catch (e) {
      return uuid();
    }
  }

  function environment() {
    try {
      return location.hostname === PROD_HOST ? 'production' : 'development';
    } catch (e) {
      return 'development';
    }
  }

  function utmMeta() {
    var out = {};
    try {
      var params = new URLSearchParams(location.search);
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
        var v = params.get(k);
        if (v) out[k] = v;
      });
    } catch (e) {}
    return out;
  }

  function send(eventName, metadata) {
    try {
      var payload = { appId: APP_ID, eventName: eventName, environment: environment(), metadata: metadata || {}, deviceId: getDeviceId() };
      var body = JSON.stringify(payload);
      if (navigator.sendBeacon) { var blob = new Blob([body], { type: 'application/json' }); if (navigator.sendBeacon(ENDPOINT, blob)) return; }
      fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
    } catch (e) {
      /* analytics must never break the page */
    }
  }

  try {
    window.swapPageView = function (path, title) {
      try {
        if (path === lastPath) return;
        lastPath = path;
        var meta = {
          path: path,
          title: title,
          referrer: document.referrer || null
        };
        var utm = utmMeta();
        for (var k in utm) {
          if (Object.prototype.hasOwnProperty.call(utm, k)) meta[k] = utm[k];
        }
        send('page_view', meta);
      } catch (e) {}
    };
  } catch (e) {}

  try {
    document.addEventListener('click', function (ev) {
      try {
        var el = ev.target;
        while (el && el.tagName !== 'A') el = el.parentElement;
        if (!el || !el.href) return;
        var url;
        try { url = new URL(el.href, location.href); } catch (err) { return; }
        if (!url.hostname || url.hostname === location.hostname) return;
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return;
        var text = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
        send('product_click', {
          target_host: url.hostname,
          target_url: url.href,
          from_path: location.pathname,
          text: text
        });
      } catch (err) {}
    }, true);
  } catch (e) {}
})();
</script>
